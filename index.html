<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0e1116">
<title>Live Tickers — Gold & US Tech</title>
<style>
  :root { --bg:#0e1116; --panel:#161b22; --line:#262d36; --text:#e6edf3; --muted:#8b949e; --gold:#e3b341; --tech:#58a6ff; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; background:var(--bg); color:var(--text); font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { display:flex; flex-direction:column; }
  header { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 16px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  h1 { font-size:16px; font-weight:600; letter-spacing:.3px; }
  .tabs { display:flex; gap:6px; background:var(--panel); padding:4px; border-radius:10px; border:1px solid var(--line); }
  .tab { appearance:none; border:0; background:transparent; color:var(--muted); font-size:14px; font-weight:600; padding:8px 14px; border-radius:7px; cursor:pointer; display:flex; align-items:center; gap:8px; }
  .tab .dot { width:8px; height:8px; border-radius:50%; }
  .tab[data-key="gold"] .dot { background:var(--gold); }
  .tab[data-key="tech"] .dot { background:var(--tech); }
  .tab.active { background:var(--line); color:var(--text); }
  .intervals { display:flex; gap:6px; padding:10px 16px; overflow-x:auto; border-bottom:1px solid var(--line); -webkit-overflow-scrolling:touch; }
  .intervals button { flex:0 0 auto; appearance:none; border:1px solid var(--line); background:var(--panel); color:var(--muted); font-size:14px; font-weight:600; padding:8px 14px; border-radius:8px; cursor:pointer; min-width:48px; }
  .intervals button.active { background:var(--text); color:var(--bg); border-color:var(--text); }
  #chart { position:relative; flex:1 1 auto; height:calc(100vh - 210px); height:calc(100dvh - 210px); min-height:420px; }
  #chart .tradingview-widget-container { position:absolute; inset:0; }
  #chart .tradingview-widget-container__widget, #chart iframe { width:100% !important; height:100% !important; }
  .pricestrip { height:78px; border-bottom:1px solid var(--line); overflow:hidden; }
  .pricestrip .tradingview-widget-container, .pricestrip .tradingview-widget-container__widget { height:100%; width:100%; }
  #fallback { display:none; position:absolute; inset:0; align-items:center; justify-content:center; text-align:center; padding:24px; color:var(--muted); font-size:14px; line-height:1.5; }
  #fallback a { color:var(--tech); font-weight:600; }
</style>
</head>
<body>
<header>
  <h1>Live Tickers</h1>
  <div class="tabs" role="tablist">
    <button class="tab active" data-key="gold" role="tab"><span class="dot"></span>Gold · XAU/USD</button>
    <button class="tab" data-key="tech" role="tab"><span class="dot"></span>US Tech · Nasdaq 100</button>
  </div>
</header>
<div class="pricestrip">
  <div class="tradingview-widget-container">
    <div class="tradingview-widget-container__widget"></div>
    <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-tickers.js" async>
    {
      "symbols": [
        { "proName": "OANDA:XAUUSD", "title": "Gold · XAU/USD" },
        { "proName": "OANDA:NAS100USD", "title": "US Tech · NAS100" }
      ],
      "colorTheme": "dark",
      "isTransparent": true,
      "showSymbolLogo": true,
      "locale": "en"
    }
    </script>
  </div>
</div>
<div class="intervals" id="intervals">
  <button data-i="1" class="active">1m</button>
  <button data-i="5">5m</button>
  <button data-i="15">15m</button>
  <button data-i="30">30m</button>
  <button data-i="60">1h</button>
  <button data-i="240">4h</button>
  <button data-i="D">1D</button>
  <button data-i="W">1W</button>
</div>
<div id="chart"></div>

<script>
  const SYMBOLS = {
    gold: "OANDA:XAUUSD",
    tech: "OANDA:NAS100USD"
  };
  let current = "gold";
  let interval = "1";

  let checkTimer;
  function load(key) {
    const el = document.getElementById("chart");
    el.innerHTML = "";
    clearTimeout(checkTimer);
    checkTimer = setTimeout(() => {
      if (!el.querySelector("iframe")) {
        const tvMap = { "1":"1","5":"5","15":"15","30":"30","60":"60","240":"240","D":"D","W":"W" };
        const url = "https://www.tradingview.com/chart/?symbol=" + encodeURIComponent(SYMBOLS[key]) + "&interval=" + tvMap[interval];
        const fb = document.createElement("div");
        fb.id = "fallback";
        fb.style.display = "flex";
        fb.innerHTML = "<div>The live chart is taking a while to load.<br>Check your connection and refresh, or<br><br><a href='" + url + "' target='_blank' rel='noopener'>Open this chart on TradingView →</a></div>";
        el.appendChild(fb);
      }
    }, 10000);
    const wrap = document.createElement("div");
    wrap.className = "tradingview-widget-container";
    const inner = document.createElement("div");
    inner.className = "tradingview-widget-container__widget";
    wrap.appendChild(inner);

    const s = document.createElement("script");
    s.src = "https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js";
    s.async = true;
    s.innerHTML = JSON.stringify({
      autosize: true,
      symbol: SYMBOLS[key],
      interval: interval,
      timezone: "Africa/Johannesburg",
      theme: "dark",
      style: "1",
      locale: "en",
      allow_symbol_change: false,
      hide_side_toolbar: false,
      withdateranges: true,
      details: true,
      calendar: false,
      support_host: "https://www.tradingview.com"
    });
    wrap.appendChild(s);
    el.appendChild(wrap);
  }

  document.querySelectorAll(".tab").forEach(btn => {
    btn.addEventListener("click", () => {
      const key = btn.dataset.key;
      if (key === current) return;
      document.querySelectorAll(".tab").forEach(b => b.classList.toggle("active", b === btn));
      current = key;
      try { localStorage.setItem("tickerTab", key); } catch (e) {}
      load(key);
    });
  });

  function markInterval() {
    document.querySelectorAll("#intervals button").forEach(b => b.classList.toggle("active", b.dataset.i === interval));
  }
  document.querySelectorAll("#intervals button").forEach(btn => {
    btn.addEventListener("click", () => {
      if (btn.dataset.i === interval) return;
      interval = btn.dataset.i;
      markInterval();
      try { localStorage.setItem("tickerInterval", interval); } catch (e) {}
      load(current);
    });
  });
  try {
    const si = localStorage.getItem("tickerInterval");
    if (si && document.querySelector('#intervals button[data-i="' + si + '"]')) { interval = si; markInterval(); }
  } catch (e) {}

  try {
    const saved = localStorage.getItem("tickerTab");
    if (saved && SYMBOLS[saved]) {
      current = saved;
      document.querySelectorAll(".tab").forEach(b => b.classList.toggle("active", b.dataset.key === saved));
    }
  } catch (e) {}
  load(current);
</script>
</body>
</html>
